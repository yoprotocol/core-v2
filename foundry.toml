# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config

# ---------------------------------------------------------------------------- #
#                                   PROFILES                                   #
# ---------------------------------------------------------------------------- #

[profile.default]
  auto_detect_solc = false
  bytecode_hash = "ipfs"
  evm_version = "shanghai"
  fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./out-optimized" },
    { access = "read", path = "package.json" },
  ]
  gas_limit = 9_223_372_036_854_775_807
  gas_reports = ["*"]
  optimizer = true
  optimizer_runs = 10_000
  out = "out"
  script = "script"
  sender = "0x1804c8AB1F12E6bbf3894d4083f33e07309d1f38"
  solc = "0.8.29"
  src = "src"
  test = "tests"

[profile.default.fuzz]
  max_test_rejects = 1_000_000
  runs = 1_000

[profile.default.invariant]
  call_override = false
  depth = 20
  fail_on_revert = true
  runs = 20
  show_metrics = false

# Speed up compilation and tests during development
[profile.lite]
  optimizer = false

  [profile.lite.fuzz]
    runs = 10

# Compile only production code with via_ir
[profile.optimized]
  out = "out-optimized"
  test = "src"
  via_ir = true

# Test against optimized artifacts without re-compiling
[profile.test-optimized]
  src = "tests"

# ---------------------------------------------------------------------------- #
#                                 OTHER CONFIG                                 #
# ---------------------------------------------------------------------------- #

[doc]
  ignore = ["**/*.t.sol"]
  out = "docs"

[etherscan]
  mainnet = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  prefer_compact = "none"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[lint]
  lint_on_build = false

[rpc_endpoints]
  arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
  base = "https://base-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
  localhost = "http://localhost:8545"
  mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
  optimism = "https://opt-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
  polygon = "https://polygon-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
  sepolia = "https://eth-sepolia.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
